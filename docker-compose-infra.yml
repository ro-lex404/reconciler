db:
    image: ankane/pgvector:latest
    container_name: hybrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: hybrid_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d hybrid_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

# 2. Redis message broker for Celery tasks
redis:
  image: redis:7-alpine
  container_name: hybrid_redis
  restart: unless-stopped
  ports:
    - "6379:6379"

volumes:
  postgres_data:
  shared_uploads: # Crucial for passing files between FastAPI, Celery, and DuckDB